# 조사 원문(research/vendors/*.md) 본문 판정과 데이터 블록이 어긋날 때의 보정.
# 회사 단위 커버리지에만 적용된다. 반드시 근거(원문 위치)를 적는다.
coverage_overrides:
  snowflake:
    L3: {value: 1, reason: "snowflake.md '회사 전체 층 커버리지' — 시맨틱 뷰 안의 테이블 관계(조인)만 ◐, 독립 온톨로지 없음"}
  palantir:
    L2: {value: 1, reason: "palantir.md '회사 전체 층 커버리지' — 전용 시맨틱 레이어 없음, Insight/Quiver·Ontology SQL 함수가 일부 대체 ◐"}

# 성숙도(FAOS L0~L5)는 누적 사다리다. 조사자는 단계별로 따로 판정했으므로
# 빌드 시 회사 커버리지로 상한을 건다 (원래 값은 maturity_claimed 로 보존).
maturity_caps:
  - {max: 2, unless: {GOV: 2}, reason: "L3 실행 게이트는 거버넌스(승인·정책) 핵심 기능이 있어야 함"}
  - {max: 3, unless: {L7: 2}, reason: "L4 출력 검증은 실행·검증 층 핵심 기능이 있어야 함"}
  - {max: 4, unless: {L5: 2, OBS: 2}, reason: "L5 폐루프는 기억·이력과 관측·평가가 모두 있어야 함"}

# 맵 표시용 짧은 이름
short_names:
  aws: AWS
  google: Google Cloud
  salesforce: Salesforce
  datahub: DataHub
  fivetran-dbt: Fivetran+dbt
